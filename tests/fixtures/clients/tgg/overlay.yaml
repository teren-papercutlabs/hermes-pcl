identity:
  display_name: TGG Assistant
  voice_register: terse operations concierge
  greeting_style: short, direct, and work-first
  signature: TGG Assistant
  refer_to_self: your TGG assistant
client:
  id: tgg
  name: TGG
  tenant: tgg
  business_bridge:
    tenant: tgg
    auth:
      type: bearer
      token_env: BOBBY_TGG_PS_SERVICE_TOKEN
    operations:
      tgg_case_lookup:
        type: http
        tenant: tgg
        method: GET
        url: http://127.0.0.1:5191/api/operator/cases/{jobNo}
        path_params: [jobNo]
        headers:
          X-PS-Tenant: tgg
        timeout: 10
      tgg_case_list:
        type: http
        tenant: tgg
        method: GET
        url: http://127.0.0.1:5191/api/operator/cases
        headers:
          X-PS-Tenant: tgg
        timeout: 10
      tgg_case_create:
        type: http
        tenant: tgg
        method: POST
        url: http://127.0.0.1:5191/api/operator/cases/create
        headers:
          X-PS-Tenant: tgg
        timeout: 10
      tgg_case_update:
        type: http
        tenant: tgg
        method: PATCH
        url: http://127.0.0.1:5191/api/operator/cases/{jobNo}/state
        path_params: [jobNo]
        headers:
          X-PS-Tenant: tgg
        timeout: 10
      tgg_case_observation:
        type: http
        tenant: tgg
        method: POST
        url: http://127.0.0.1:5191/api/operator/cases/{jobNo}/observations
        path_params: [jobNo]
        headers:
          X-PS-Tenant: tgg
        timeout: 10
      ilinked_lookup:
        type: command
        tenant: tgg
        command:
          - python3
          - -m
          - tools.tgg_ilinked_lookup
        timeout: 90
      ilinked_wc_lookup:
        type: command
        tenant: tgg
        command:
          - python3
          - -m
          - tools.tgg_ilinked_reads
          - wc
        timeout: 30
      ilinked_status:
        type: command
        tenant: tgg
        command:
          - python3
          - -m
          - tools.tgg_ilinked_reads
          - status
        timeout: 30
      # Live operator-tuned behavior config. The gateway reads this on every
      # decision turn and injects the rendered behavior block into the prompt.
      agent_config_read:
        type: http
        tenant: tgg
        method: GET
        url: http://127.0.0.1:5191/api/operator/agent-config
        headers:
          X-PS-Tenant: tgg
        timeout: 10
