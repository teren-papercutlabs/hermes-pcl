workflow:
  id: synthetic-freight-loop
  entity: shipment_job
  correlation_keys:
    - container_no
    - job_no
    - booking_ref
  disambiguators:
    - customer
    - vessel
    - direction
  create_on:
    - type: trucking_instruction
      brief: synthetic_mail_ingest
  email_extraction:
    schema: synthetic-freight-email-event-v1
    correlation_keys:
      - container_no
      - job_no
      - booking_ref
    disambiguators:
      - customer
      - vessel
      - direction
    instruction: >-
      Classify the persisted email as exactly one declared event type:
      trucking_instruction, pickup_advice, container_assigned, vgm_reply, or
      gate_in. Extract only facts explicitly present in the email. Return
      correlation values only for the correlation_keys declared in this
      contract. Put explicitly stated disambiguators in payload when present.
      Omit unknown values rather than guessing. If none of the declared event
      types fits, return a null event_type and an empty corr object.
    event_types:
      trucking_instruction: {}
      pickup_advice: {}
      container_assigned: {}
      vgm_reply: {}
      gate_in: {}
  steps:
    - key: ingest
      mode: propose
      turn:
        brief: ingest the trucking instruction
      advance_to: await_pickup

    - key: await_pickup
      mode: auto
      waits:
        - kind: event
          types:
            - pickup_advice
          schema: pickup_advice_v1
          advance_to: create_job
        - kind: timer
          after: 72h
          action: chase
          max_fires: 3
          then: escalate

    - key: create_job
      mode: propose
      turn:
        brief: create the shipment job
      actions:
        - job_create
        - sheet_log
      advance_to: await_container

    - key: await_container
      mode: manual
      waits:
        - kind: event
          types:
            - container_assigned
          schema: container_assigned_v1
          advance_to: notify_customer

    - key: notify_customer
      mode: propose
      turn:
        brief: notify the customer
      actions:
        - customer_email
      advance_to: await_vgm

    - key: await_vgm
      mode: auto
      waits:
        - kind: event
          types:
            - vgm_reply
          schema: vgm_reply_v1
          advance_to: await_gatein
        - kind: timer
          after: 24h
          action: chase
          max_fires: 2
          then: escalate

    - key: await_gatein
      mode: auto
      waits:
        - kind: event
          types:
            - gate_in
          schema: gate_in_v1
          advance_to: invoice

    - key: invoice
      mode: propose
      turn:
        brief: prepare and send the invoice
      actions:
        - charges_add
        - invoice_generate
        - invoice_email
      advance_to: done

    - key: done
      mode: auto
