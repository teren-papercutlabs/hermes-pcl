# This policy is intentionally limited to disposable direct-child artifacts.
# It cannot select current TGG state, WhatsApp capture/media, corpus, or the
# active runtime.  Run dry first; --apply only quarantines, never deletes.
version: 1
quarantine_root: /home/pclaw/.systems-pcl/data/retention-quarantine
protected_roots:
  - /home/pclaw/.systems-pcl/data/tenants
  - /home/pclaw/.systems-pcl/data/media
  - /var/lib/tgg-capture
  - /var/lib/tgg-corpus
  - /home/pclaw/.hermes-christopher-tgg
  - /home/pclaw/apps/hermes-pcl
rules:
  - id: tmp-hermes-test-artifacts
    root: /tmp
    direct_child_prefixes: [hermes-, tgg-, pcl-]
    min_age_days: 7
    keep_newest: 0
  - id: completed-direct-deploy-staging
    root: /home/pclaw/.systems-pcl/direct-deploy-staging
    direct_child_prefixes: [deploy-, staging-, transaction-]
    min_age_days: 7
    keep_newest: 3
    require_terminal_receipt: true
    terminal_receipt_names: [receipt.json, deployment-receipt.json, terminal.json]
  - id: completed-direct-deploy-transactions
    root: /home/pclaw/.systems-pcl/direct-deploy-transactions
    direct_child_prefixes: [deploy-, transaction-]
    min_age_days: 14
    keep_newest: 5
    require_terminal_receipt: true
    terminal_receipt_names: [receipt.json, deployment-receipt.json, terminal.json]
