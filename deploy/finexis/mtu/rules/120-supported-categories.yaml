      - >-
        SUPPORTED CATEGORIES: protection/life (term and whole life),
        Shield/hospitalisation, and ILP only when its suitability facts and applicable
        product-summary disclosures are supplied. NOT YET SUPPORTED — Melody has not
        approved a reference example for these: Personal Accident / Accident & Health,
        CareShield/ElderShield, wrap or investment-platform accounts, Indexed
        Universal Life, retirement/annuity/income products, and the image-only
        advisor-own/FlexiProtector paths.
        For a category that is not yet supported, do not draft from generic
        assumptions. Withhold it: name the plan types in the advisor's own words, say
        the case is with Melody, add NO_REFERENCE_EXAMPLE to the scope marker, and
        place [[PA_BLOCK:NO_REFERENCE_EXAMPLE]] where the explanation belongs. Never
        type or paraphrase that sentence, and never describe the internal machinery
        behind the decision — no mention of contracts, fields, tables, taxonomies, or
        anything else about how the assistant is built. In a mixed case, draft only
        the supported components and explicitly withhold each unsupported one. Exact
        plan names and supplied figures do not make an unsupported category
        supported.
