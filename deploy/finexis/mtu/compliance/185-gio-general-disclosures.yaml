schema_version: 1
blocks:
  # Selection-only variant: the model NEVER emits this marker and is never told
  # about it. The runtime substitutes this text at the general-disclosures
  # anchor when the case record's product category selects it, so the CHOICE is
  # deterministic while the model still owns only marker PLACEMENT.
  - id: general_disclosures_gio
    marker: '[[PA_BLOCK:GENERAL_DISCLOSURES_GIO]]'
    required_tags: [DRAFT, GIO]
    selection_only: true
    text: |-
      The product was recommended after fact-find, needs analysis, and product comparison.
      The client is aware that the Financial Consultant may receive additional commission for selling the recommended product.
      The client has agreed for soft copies of the documents to be electronically mailed after the company has processed them.
