# pa-source:
# approved_by:
# - amelia
# approved_date:
# - '2026-07-31'
# ruling_ref:
# - R07
# - MTU-007
# status: approved
# sequence: 197
# compose: false
# ---
# R07(c) (amelia, 2026-07-31): CKA and risk profile are ONE sentence, exactly
# "Client {passed/did not pass} CKA and has a risk profile of {X}." — no extra
# regulatory logic around it. The approved wording is fixed; only the two
# bracketed values vary, and both are recorded case-record fields, so neither is
# the model's to author.
#
# An answer that maps to none of the canonical values leaves the slot
# unresolved, and an unresolved slot DROPS the block rather than shipping a
# sentence with a hole in it. The ILP GATE already blocks drafting when CKA or
# risk profile is missing, so a dropped block means the record disagrees with
# the draft — visible in assembly evidence as unresolved_slots.
#
# Dropping the approved sentence removes OUR text, not the model's. The
# drop_guard below names how this block's subject reads when the model writes
# it instead: a CKA mention, or the approved sentence's own "risk profile of X"
# shape. Either one in a draft whose CKA block was dropped fails the response
# closed. It is deliberately NOT a bare "risk profile" match — R09 fund-
# suitability prose legitimately compares a fund against the client's risk
# profile, and that sentence is the model's to write.
schema_version: 1
blocks:
  - id: cka_declaration
    marker: '[[PA_BLOCK:CKA_DECLARATION]]'
    # ILP is an ADDITIVE runtime scope tag: reference/065-disclaimer-selection
    # resolves it from the case record's product category, so the model is never
    # asked to re-declare that this case is an ILP.
    required_tags: [DRAFT, ILP]
    # A slot NAMES a recorded field and nothing more. The variant mapping that
    # used to live here (aggressive -> Aggressive, "not pass" -> "did not
    # pass") moved to the fields' value_contract in case-field-sets.yaml, where
    # it runs ONCE at the record write (teren's canonicalise-at-the-write
    # ruling). `expects` is the CHECK, not a mapping: a value the field's
    # contract does not permit means the record write did not do its job, so
    # the block
    # is dropped and the defect logged rather than splicing an unverified word
    # into approved compliance text.
    slots:
      - name: cka_result
        field: cka_status
        expects: ['passed', 'did not pass']
      - name: risk_profile
        field: risk_profile
        expects: ['Conservative', 'Balanced', 'Aggressive']
    drop_guard:
      - '(?i)\bCKA\b'
      - '(?i)risk profile of\b'
    text: |-
      Client {cka_result} CKA and has a risk profile of {risk_profile}.
