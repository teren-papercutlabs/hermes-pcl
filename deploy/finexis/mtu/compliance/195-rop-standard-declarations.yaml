schema_version: 1
blocks:
  - id: rop_standard_declarations
    marker: '[[PA_BLOCK:ROP_STANDARD_DECLARATIONS]]'
    required_tags: [DRAFT, ROP]
    # The replacement disclosures belong INSIDE each supported replacement
    # component, not hoisted once to the top of a multi-component draft
    # (MTU-021). The model still chooses where; repeating the marker is how it
    # says "here too", and the runtime inserts the same approved text at each.
    repeatable: true
    text: |-
      The client was advised of the replacement disadvantages and wishes to proceed.
      Other available options—such as increasing the sum assured under the existing policy, attaching riders, or converting the policy—have been explored. The recommendation to proceed with a replacement was made only after a thorough assessment confirmed that it is suitable and in the best interest of the client.
