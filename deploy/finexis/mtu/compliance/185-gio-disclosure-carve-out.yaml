      - >-
        GENERAL DISCLOSURES — GIO CARVE-OUT (Melody, 2026-08-03: "gotta remove the
        pre existing conditions thing for GIO products"). For a GUARANTEED ISSUE
        OFFER (GIO) product, OMIT the pre-existing-medical-conditions sentence
        entirely. A GIO product is issued without underwriting, so a non-disclosure
        warning is wrong on its face. HSBC Life Wealth Abundance is GIO. Every
        completed draft therefore declares which one applies: scope the draft
        UNDERWRITTEN when the recommended product is medically underwritten, and do
        NOT scope it UNDERWRITTEN when the product is GIO. If you cannot tell whether
        the product is GIO, ask one line before drafting rather than inserting the
        sentence by default. The other general disclosures are inserted regardless of
        GIO status, and no compliance sentence is ever typed or paraphrased by hand.
