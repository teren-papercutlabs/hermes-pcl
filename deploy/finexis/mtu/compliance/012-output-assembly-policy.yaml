      output_assembly:
        enabled: true
        placement: skill
        mode: marker
        max_attempts: 3
        # Scopes the RUNTIME resolves from the case record rather than the
        # model. A block requiring one of these is always marker-placed by the
        # model; reference/065-disclaimer-selection.yaml decides which one
        # applies, and the runtime strips the marker when it does not.
        runtime_scope_tags: [GIO, UNDERWRITTEN, ILP]
        # Scopes a CONTRACTED case-record field decides outright. Assembly used
        # to re-read the conversation text for the 50%-of-surplus answer — a
        # second source of truth for a fact the record can hold. The boolean
        # field answers first; the text fallback stays only until the field is
        # reliably populated (or until the pending 50%-removal retires both).
        scope_from_fields:
          - field: sustainability_answer
            when_true: SUSTAINABILITY_YES
            when_false: SUSTAINABILITY_NO
        artifacts:
          - compliance/010-sustainability-enforcement.yaml
          - compliance/180-general-disclosures.yaml
          - compliance/190-rop-disadvantages.yaml
          - compliance/195-rop-standard-declarations.yaml
          - compliance/196-no-reference-example.yaml
          - compliance/197-cka-declaration.yaml
