# The plan types the ruling also requires are NOT part of this sentence — they
# are named separately by the model in the advisor's own words (a judged
# expectation), so this block carries no slot.
schema_version: 1
blocks:
  - id: no_reference_example
    marker: '[[PA_BLOCK:NO_REFERENCE_EXAMPLE]]'
    # Deliberately NOT gated on DRAFT/NO_DRAFT: a mixed case withholds one
    # component while drafting another, so the sentence must be available in
    # both scopes.
    required_tags: [NO_REFERENCE_EXAMPLE]
    # A mixed case can withhold more than one component.
    repeatable: true
    text: |-
      This type of replacement has not been submitted before, as Melody has not approved a reference example for it.
