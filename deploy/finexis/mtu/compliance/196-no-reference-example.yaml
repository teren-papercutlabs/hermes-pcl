# replacement path has no approved reference example. It was carried as prose in
# reference/061-ekyc-directory-map.yaml's escalation_cue and relayed by the
# model, which paraphrased it in three of three nightly cases. It is compliance
# wording like any other: the model places the marker, the runtime writes the
# sentence.
