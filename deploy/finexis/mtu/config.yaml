# hermes-mtu gateway config (Studio-local pilot) — deployed to $HERMES_HOME/config.yaml
#
# Model: piloting on gpt-5.4-mini via provider `custom` (OpenAI-direct) — the proven-working
#   pattern for OpenAI-direct on this hermes runtime (matches ~/.hermes-tss-support). NOTE:
#   `openai-direct-primary` is a NAMED runtime-provider that only resolves in a HERMES_HOME
#   carrying a `runtime_providers` registry block (christopher's does); a fresh HERMES_HOME
#   does NOT, so it fails "Unknown provider". `provider: custom` + base_url + api_key_source
#   is the portable equivalent and is what actually runs here.
#   The MTU constitution's DESIGN intent is gemini-3.1-flash-lite; christopher deliberately
#   moved OFF gemini to gpt-5.4-mini for structured-extraction/drafting accuracy. FLAGGED
#   model choice (see ship report + ops note), not a silent swap. A GEMINI_API_KEY IS present
#   on this host — swap back by setting provider: gemini + default: gemini-3.1-flash-lite.
model:
  provider: custom
  default: gpt-5.4-mini
  base_url: https://api.openai.com/v1
  api_key_source:
    type: env
    secrets_env_key: OPENAI_API_KEY
agent:
  profile: pa
  max_turns: 12
pa:
  enabled: true
  job_type: bor_generation                 # REQUIRED — MTU declares no selectors; without this the constitution is silently ignored
  constitution_path: /Users/pcloffice/.hermes-mtu/mtu_constitution.yaml
  # Empty/omitted defaults to $HERMES_HOME/knowledge. The bootstrap/deploy sync
  # installs manifest-declared knowledge and reference files beneath this root.
  knowledge_path: knowledge
platforms:
  telegram:
    enabled: true
    extra:
      # DMs are never gated by require_mention (the adapter excludes DMs from the
      # mention check), so advisors still DM the bot directly with no @mention.
      # In GROUP chats, require_mention gates responses: the bot only replies when
      # @mentioned or replied-to — it does not answer every message in the group.
      require_mention: true
# Who may use the bot (DM or group) is gated by TELEGRAM_ALLOWED_USERS in .env —
# add advisors' Telegram IDs there as the pilot widens.
# Each participant in a group gets an isolated BOR session — two advisors'
# cases never mix. (Gateway default is true; set explicitly for clarity.)
group_sessions_per_user: true
