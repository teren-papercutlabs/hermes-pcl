id: R21
who: teren
date: 2026-08-01
verbatim: "switch it out to 5.6 luna high"
source: >-
  Teren-directed model swap applied to the live runtime on 2026-08-01. The exact
  words are preserved in the live config's own provenance comment
  (~/.hermes-mtu/config.yaml, `model.default: gpt-5.6-luna` — "teren-directed
  2026-08-01 (\"switch it out to 5.6 luna high\"); was gpt-5.4-mini
  (bak-pre-luna-20260801)"), together with `agent.reasoning_effort: high` carrying
  the same date. The deploy-tree sources were not updated at the time, so the
  typed constitution preamble and the deploy-tree config.yaml both still declared
  `openai-direct-primary` / `gpt-5.4-mini` — a constitution that named a different
  model from the one answering, and a deploy source that would have REGRESSED the
  live model on the next deploy.
scope:
  knowledge_type: F
  artifacts:
    - rules/000-identity-job-preamble.yaml
    - config.yaml
  tags: []
expected_behavior: >-
  The typed constitution's runtime block and the deploy-tree config.yaml both name
  the model that actually runs: provider `custom`, model `gpt-5.6-luna`,
  reasoning_effort `high`. The constitution's runtime block is DECLARATIVE — the
  gateway selects its provider and model from config.yaml's `model:` block, and
  nothing in the runtime loader reads the constitution block to choose one — so
  config.yaml stays authoritative and the constitution block must not drift from
  it.
eval_cases: []
notes: >-
  No behavior assertion is added to the corpus for this ruling: it changes which
  model answers, not what the agent is required to do, and the corpus is the
  instrument that MEASURES a model swap rather than a thing the swap should be
  asserted against. Per CHANGE-PROCEDURE, a model or provider swap is its own
  deploy gate class (full corpus, >= 4 draws per case, all semantic judgments
  passed, canaries clean) and that battery is the evidence this ruling needs
  before a deploy, not an eval case.
