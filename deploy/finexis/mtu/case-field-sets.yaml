# MTU — case field sets (CLIENT CONFIG)
#
# The required-field set per case type, consumed by the PA-generic case
# record module (agent/pa_case_record.py).  Field ids are opaque to that
# module; all MTU/Finexis vocabulary lives HERE, in the deployment tree, and
# never in the shared layer.
#
# Grounded in deploy/finexis/mtu/knowledge/bor-required-checks.yaml
# (category_requirements) and the intake / material-missing rules.  Those files
# remain the authority on WHY a field is required; this file is the machine
# -readable form the record queries against.
#
# Field semantics:
#   required  - the case cannot be drafted from without it
#   askable   - false means asking for it is a DEFECT: it is derived,
#               template default, or maintained outside the case.  An
#               unaskable field never appears in the empty-required set that
#               intake generates questions from.
#   ask_hint  - the question shape when it IS asked; intake composes from it,
#               it is not sent verbatim
#   holds     - what the field HOLDS, for the extractor that has to recognise
#               a value in a message. Separate from ask_hint on purpose: an
#               ask_hint enumerates everything a COMPLETE answer eventually
#               carries, so an extractor reading it as a description treats it
#               as a bar the message must clear and drops a short but genuine
#               answer ("BOR for Voyage 15" states the proposed plan). Falls
#               back to ask_hint when absent.
#   derived_from - advisory: which recorded answer a derivation may stand on
#   value_contract - what the field is allowed to HOLD (see below)
#
# Phase-2 note: the record module supplies the query and the derivation hook;
# the derivation CALLABLES (e.g. is_replacement from existing_plans) are
# client-owned and wired at the deployment, not in the shared module.
#
# ── THE VALUE CONTRACT ────────────────────────────────────────────────────
#
# teren, 2026-08-04: a field whose values come from a fixed set must be
# converted to that set AT THE RECORD WRITE, not by whoever reads it later.
# The record is what the prompt, the suitability computation, an approved
# sentence's slot, and every eval read; if each of them maps "aggressive" ->
# "Aggressive" for itself, they drift one reader at a time, and the drift is
# invisible until a client sees the wrong word in a BOR.
#
# So a field may declare a `value_contract`, enforced ONCE in
# agent/pa_case_record.py at the moment the field is populated:
#
#   kind: enum      - a closed set. `values:` is canonical; `match:` maps the
#                     free text advisors actually write onto one of them, in
#                     DECLARATION ORDER (narrow patterns first).
#   kind: boolean   - stored as a real boolean, so nothing downstream has to
#                     decide whether "yes" and "true" are the same answer.
#   kind: table     - the valid set lives in a reference file that someone
#                     else maintains (see `value_tables` at the foot). Use
#                     `key_field:` when the valid set depends on ANOTHER
#                     field's answer.
#
#   on_unmatched: unpopulate (default) | accept
#     unpopulate - the answer resolves to nothing, so the field STAYS EMPTY,
#                  stays in the empty-required set, and intake asks a
#                  clarification before any draft. The advisor's actual words
#                  are kept in provenance (raw_value) so the ask can quote
#                  them instead of repeating the original question.
#     accept     - keep the answer as written. Correct when the table is a
#                  list of KNOWN examples rather than a closed set: a name
#                  missing from it is a gap in the table, not a bad answer.
#   stored_form: entry_value (default) | as_written
#     as_written - the table match VALIDATES but does not rewrite. Correct for
#                  a descriptive field whose value carries far more than the
#                  identifier; rewriting would destroy the premium, term, and
#                  rider detail the advisor supplied.
#
# NEVER a guess: an answer that satisfies no contract leaves the field empty
# and produces a question. It never resolves to the nearest plausible value.

version: 1

field_sets:

  # ── Protection / life: term, whole life, ILP-protection, CI ──────────
  protection_life:
    case_type: protection_life
    fields:
      - id: existing_plans
        required: true
        askable: true
        ask_hint: >-
          Existing plan(s) with the facts the matching category contract needs
          — insurer, plan name, category, sum assured by benefit, premium,
          coverage till age. "None" for a first purchase.
        holds: >-
          The plan(s) the client already holds, however the advisor names
          them — a product name alone IS the value. "None" for a first
          purchase.
        # IDENTITY IS NOT COMPLETENESS (see the value-contract note at the
        # head of this file). `holds` deliberately lets a bare product name
        # populate this field, because the name IS a stated fact. But a name
        # is not what R01 calls a material fact: "supplied protection amounts
        # or durations needed for a comparison". Without this, "GE term plan"
        # fills the field, the field leaves the empty-required set, and the
        # record tells the model the case is ready to draft — which is
        # exactly the MTU-011 defect (a one-line replacement request produced
        # a complete BOR). "None" satisfies it: a first purchase has no
        # amounts to give, and the answer is complete as it stands.
        sufficiency:
          description: >-
            the protection amount(s) or premium, or the coverage duration
          any_of:
            - name: "an amount"
              pattern: '(?i)(s?\$\s?[\d,]+|\b[\d,]+\s*(sgd|dollars)\b|\b\d+\s?k\b)'
            - name: "a duration"
              pattern: '(?i)(\b\d{1,2}\s*-?\s*(year|yr)s?\b|\bto\s+age\s*\d{2}\b|\bage\s*\d{2}\b|\b\d{1,2}\s?pay\b|\bmip\s?\d{1,2}\b)'
            - name: "an explicit none"
              pattern: '(?i)^[\s\[\{"'']*(none|no|nil|n/?a|no existing|not applicable|first purchase|new purchase)\b'
        notes: "The starting position the BOR must state clearly."

      - id: proposed_plan
        required: true
        askable: true
        ask_hint: >-
          Proposed plan — insurer, plan name, riders, category, sum assured by
          benefit, first-year and subsequent premium, policy term.
        holds: >-
          The plan being proposed, however the advisor names it. A product
          name or shorthand on its own IS the value, INCLUDING when it appears
          inside a request to produce a document ("BOR for <product>") — the
          product named in the request IS the proposed plan, so record that
          name. When a later message adds detail about that same plan —
          premium, term, riders, sum assured, category — record the field
          again as the name PLUS that detail, so the value grows instead of
          either staying a bare name or losing it.
        # VALIDATE, NEVER REWRITE. The approved-product list (062) says in its
        # own escalation_cue that a product with no entry is NOT a reason to
        # withhold a draft — use the advisor's own words for it. So this
        # contract accepts an unmatched name (on_unmatched: accept) and keeps
        # the answer whole (stored_form: as_written); the match only records
        # that the product IS one we hold reference examples for. Unpopulating
        # here would invent a refusal amelia explicitly ruled against.
        value_contract:
          kind: table
          table: approved_products
          on_unmatched: accept
          stored_form: as_written
        # IDENTITY IS NOT COMPLETENESS. Same reasoning as existing_plans: the
        # product name is a real fact and is recorded, but a BOR cannot be
        # written from a name. A product-name shorthand that carries its own
        # period ("Voyage 15", "10pay") satisfies the duration probe, which is
        # correct — the advisor did state a material fact inside the name.
        sufficiency:
          description: >-
            the premium or sum assured, or the policy term / minimum
            investment period
          any_of:
            - name: "an amount"
              pattern: '(?i)(s?\$\s?[\d,]+|\b[\d,]+\s*(sgd|dollars)\b|\b\d+\s?k\b)'
            - name: "a duration"
              pattern: '(?i)(\b\d{1,2}\s*-?\s*(year|yr)s?\b|\bto\s+age\s*\d{2}\b|\bage\s*\d{2}\b|\b\d{1,2}\s?pay\b|\bmip\s?\d{1,2}\b|\b(voyage|abundance)\s*\d{1,2}\b)'

      - id: is_replacement
        required: true
        askable: false
        derived_from: [existing_plans]
        notes: >-
          DERIVED, never asked as its own item (amelia-ruled 2026-08-01).
          No existing plans = non-ROP, no further question. An existing plan
          stated as being replaced = ROP. The yes/no replacement question is
          asked only when an existing plan exists and its replacement status
          was not stated — and it is asked against existing_plans, not as a
          separate ROP item.
        value_contract:
          kind: boolean
          match:
            - {pattern: '(?i)^\s*(yes|rop|replacement)\b', value: true}
            - {pattern: '(?i)^\s*(no|non-rop|not a replacement)\b', value: false}

      - id: replaced_products
        required: false
        askable: true
        applies_when: rop
        ask_hint: "Which product(s) are being replaced?"

      - id: replacing_products
        required: false
        askable: true
        applies_when: rop
        ask_hint: "Which product(s) are replacing them?"

      - id: client_stated_rationale
        required: false
        askable: false
        notes: >-
          NEVER SOLICITED. Standard narrative defaults supply this; record it
          only when the advisor volunteers it.

      - id: sustainability_answer
        required: false
        askable: true
        ask_hint: >-
          Do the client's total annual premiums exceed 50% of their surplus?
        holds: >-
          Whether total annual premiums EXCEED 50% of the client's surplus.
          True = they exceed it; false = they do not.
        notes: >-
          PROMOTED FROM RAW-TEXT MATCHING (2026-08-04). Output assembly used to
          decide the sustainability scope by regex over the conversation text —
          a second source of truth for a fact the record should hold. It is now
          a contracted field, and compliance/012 maps it to the scope tag.
          NOT required: the answer is volunteered, and forcing it into the
          empty-required set would create an intake question amelia never
          ruled. Assembly still falls back to text matching when the field is
          empty, so nothing silently loses its compliance scope.
          MAY RETIRE: if the pending 50%-removal ruling confirms, this field
          and its block go away together — that is a deletion, not a rework.
        value_contract:
          kind: boolean
          match:
            # Ordered: the negations must be read before the bare "exceed".
            - {pattern: '(?i)(do(es)? not exceed|below 50%|under 50%|less than 50%|within 50%)', value: false}
            - {pattern: '(?i)(more than 50%|exceeds? 50%|above 50%|over 50%)', value: true}

      - id: product_category
        required: false
        askable: false
        derived_from: [proposed_plan]
        notes: >-
        notes: >-
          DERIVED from the PRODUCT the advisor named (see the product_category
          derivation below), never asked. Drives the deterministic disclaimer-set
          selection in reference/065-disclaimer-selection.yaml (investment products
          are GIO — no medical underwriting — so they must not carry the medical
          non-disclosure line). A category that cannot be defended from the product
          or from an actual case classification stays EMPTY and output assembly
          fails closed; it is never defaulted to protection_life, because a default
          would silently mean UNDERWRITTEN.
        # CONTRACT AND DERIVATION, COMPOSED. The derivation at the foot of this
        # file PRODUCES the value from the product the advisor named; this
        # contract is what the record CHECKS it against at the write, so the
        # stored category is always one of the keys
        # reference/065-disclaimer-selection.yaml switches on and can never be a
        # variant spelling a later reader has to normalise for itself.
        # `unresolved` IS one of the permitted values on purpose: it is the
        # derivation's terminal answer for a product whose category has no
        # approved requirement set ("Careshield Plus" is not an Integrated
        # Shield Plan), and 065 maps it to NO scope tag, so a completed draft
        # fails assembly closed. It therefore has to be STORABLE — a contract
        # that unpopulated it would hand the field back to the weaker
        # case-type mirror, which is exactly the guess the derivation exists to
        # replace. An answer the contract cannot resolve populates nothing.
        value_contract:
          kind: enum
          values: [protection_life, investment_linked, shield_hospitalisation, unresolved]
          match:
            - {pattern: '(?i)^unresolved$', value: unresolved}
            - {pattern: '(?i)(investment[-_ ]?linked|\bilp\b)', value: investment_linked}
            - {pattern: '(?i)(shield|hospitalisation|hospitalization)', value: shield_hospitalisation}
            - {pattern: '(?i)(protection|life|term|whole[-_ ]?life|\bci\b)', value: protection_life}

  # ── ILP: protection/life contract plus suitability facts ─────────────
  investment_linked:
    case_type: investment_linked
    fields:
      - id: existing_plans
        required: true
        askable: true
        ask_hint: "Existing plan(s), or 'none' for a first purchase."
        holds: >-
          The plan(s) the client already holds, however the advisor names
          them — a product name alone IS the value. "None" for a first
          purchase.
        # IDENTITY IS NOT COMPLETENESS (see the value-contract note at the
        # head of this file). `holds` deliberately lets a bare product name
        # populate this field, because the name IS a stated fact. But a name
        # is not what R01 calls a material fact: "supplied protection amounts
        # or durations needed for a comparison". Without this, "GE term plan"
        # fills the field, the field leaves the empty-required set, and the
        # record tells the model the case is ready to draft — which is
        # exactly the MTU-011 defect (a one-line replacement request produced
        # a complete BOR). "None" satisfies it: a first purchase has no
        # amounts to give, and the answer is complete as it stands.
        sufficiency:
          description: >-
            the protection amount(s) or premium, or the coverage duration
          any_of:
            - name: "an amount"
              pattern: '(?i)(s?\$\s?[\d,]+|\b[\d,]+\s*(sgd|dollars)\b|\b\d+\s?k\b)'
            - name: "a duration"
              pattern: '(?i)(\b\d{1,2}\s*-?\s*(year|yr)s?\b|\bto\s+age\s*\d{2}\b|\bage\s*\d{2}\b|\b\d{1,2}\s?pay\b|\bmip\s?\d{1,2}\b)'
            - name: "an explicit none"
              pattern: '(?i)^[\s\[\{"'']*(none|no|nil|n/?a|no existing|not applicable|first purchase|new purchase)\b'

      - id: proposed_plan
        required: true
        askable: true
        ask_hint: >-
          Proposed ILP — insurer, plan name, riders, sum assured by benefit,
          first-year and subsequent premium, policy term, minimum investment
          period.
        holds: >-
          The plan being proposed, however the advisor names it. A product
          name or shorthand on its own IS the value, INCLUDING when it appears
          inside a request to produce a document ("BOR for <product>") — the
          product named in the request IS the proposed plan, so record that
          name. When a later message adds detail about that same plan —
          premium, term, riders, sum assured, category — record the field
          again as the name PLUS that detail, so the value grows instead of
          either staying a bare name or losing it.
        # VALIDATE, NEVER REWRITE. The approved-product list (062) says in its
        # own escalation_cue that a product with no entry is NOT a reason to
        # withhold a draft — use the advisor's own words for it. So this
        # contract accepts an unmatched name (on_unmatched: accept) and keeps
        # the answer whole (stored_form: as_written); the match only records
        # that the product IS one we hold reference examples for. Unpopulating
        # here would invent a refusal amelia explicitly ruled against.
        value_contract:
          kind: table
          table: approved_products
          on_unmatched: accept
          stored_form: as_written
        # IDENTITY IS NOT COMPLETENESS. Same reasoning as existing_plans: the
        # product name is a real fact and is recorded, but a BOR cannot be
        # written from a name. A product-name shorthand that carries its own
        # period ("Voyage 15", "10pay") satisfies the duration probe, which is
        # correct — the advisor did state a material fact inside the name.
        sufficiency:
          description: >-
            the premium or sum assured, or the policy term / minimum
            investment period
          any_of:
            - name: "an amount"
              pattern: '(?i)(s?\$\s?[\d,]+|\b[\d,]+\s*(sgd|dollars)\b|\b\d+\s?k\b)'
            - name: "a duration"
              pattern: '(?i)(\b\d{1,2}\s*-?\s*(year|yr)s?\b|\bto\s+age\s*\d{2}\b|\bage\s*\d{2}\b|\b\d{1,2}\s?pay\b|\bmip\s?\d{1,2}\b|\b(voyage|abundance)\s*\d{1,2}\b)'

      - id: is_replacement
        required: true
        askable: false
        derived_from: [existing_plans]
        # The derivation table below resolves to "yes"/"no"; the contract turns
        # those into a real boolean, so no reader downstream has to decide
        # whether "yes", "Yes", and "true" are the same answer.
        value_contract:
          kind: boolean
          match:
            - {pattern: '(?i)^\s*(yes|rop|replacement)\b', value: true}
            - {pattern: '(?i)^\s*(no|non-rop|not a replacement)\b', value: false}

      - id: min_investment_period
        required: true
        askable: true
        ask_hint: >-
          Minimum investment period for the proposed ILP. When the advisor has
          already named a period — including a number carried in the product name
          ("Voyage 15", "10pay") — this is a ONE-LINE CONFIRM of that period for
          that product, not a fresh question (R19: a period is only real if the
          product offers it, and only Abundance's periods are confirmed today).
        notes: >-
          Derived ONLY for a product whose available periods are confirmed in this
          constitution or a supplied product summary (currently Abundance = MIP10).
          For every other product the derivation deliberately leaves this EMPTY so
          the confirm ask fires.
        # R19 (Melody, 2026-08-03): a minimum investment period is only real
        # if the product actually offers it — Wealth Abundance is MIP10 ONLY,
        # and a 15- or 20-year Abundance reached a real advisor once. So the
        # valid set is KEYED on the proposed plan. A product whose confirmed
        # periods are not on file constrains nothing (the table simply has no
        # `values` for it), which is the honest behaviour: 160 already tells
        # the agent to ask one line to confirm the period in that case, and
        # inventing a restriction here would be the mirror defect.
        # THE CONTRACT AND THE DERIVATION GUARD DIFFERENT WRITERS. The
        # derivation only ever fills a period for a product whose periods are
        # confirmed, so an unconfirmed product stays empty and the confirm ask
        # fires; this contract catches the other direction — a period the
        # ADVISOR stated that the product does not offer ("Abundance 15")
        # unpopulates and earns a clarification rather than being recorded.
        # AND THE CONTRACT MUST ACCEPT THE ANSWER AN ADVISOR ACTUALLY WRITES.
        # A table whose only permitted spelling is its own canonical entry
        # refuses "minimum investment period 10 years" — a CORRECT answer to
        # the confirm ask — and turns it into a second question about the
        # thing the advisor just answered. `match:` is the wording map (it is
        # what every enum contract in this file uses for the same reason); the
        # permitted SET is still the keyed row's, so a period the product does
        # not offer is refused however it is worded.
        value_contract:
          kind: table
          table: product_min_investment_periods
          key_field: proposed_plan
          on_unmatched: unpopulate
          stored_form: entry_value
          match:
            - {pattern: '(?i)\b(?:10|ten)\s*-?\s*(?:year|yr)|\bmip\s*-?\s*10\b', value: '10-year minimum investment period'}

      - id: cka_status
        required: true
        askable: true
        ask_hint: "CKA outcome for the client."
        # The canonical values ARE the words the approved R07(c) sentence
        # needs ("Client {passed|did not pass} CKA ..."), so the slot in
        # compliance/197 splices a recorded value straight in without mapping
        # anything. Narrow pattern first: "did not pass" must never be read by
        # the "pass" rule.
        value_contract:
          kind: enum
          values: ["passed", "did not pass"]
          match:
            - {pattern: '(?i)(did not pass|not pass|fail|unsuccessful|\bno\b)', value: "did not pass"}
            - {pattern: '(?i)(pass|clear|complet|\byes\b)', value: "passed"}

      - id: risk_profile
        required: true
        askable: true
        ask_hint: "Client risk profile."
        # teren's probe that produced this whole reshape: "is aggressive a
        # valid input". It is — and it is recorded as "Aggressive", once, here.
        value_contract:
          kind: enum
          values: [Conservative, Balanced, Aggressive]
          match:
            - {pattern: '(?i)\bconservative\b', value: Conservative}
            - {pattern: '(?i)\bbalanced\b', value: Balanced}
            - {pattern: '(?i)\baggressive\b', value: Aggressive}

      - id: fund_selection
        required: true
        askable: true
        ask_hint: "Fund name(s) selected."
        # A KNOWN fund is stored under the fund table's canonical name, because
        # the R09 alignment computation looks it up by exactly that, and
        # "Franklin Tech Fund" must not read as a different fund from
        # "Franklin Technology Fund".
        #
        # An UNKNOWN fund is ACCEPTED as written, and this is deliberate.
        # on_unmatched: unpopulate would be the tempting reading of R09's "if
        # the fund cannot be resolved, ask for the specific fund name" — but
        # 066 currently holds three funds, transcribed from the two that one
        # rule happens to name. Against a table that thin, unpopulating turns
        # "our list is incomplete" into "the advisor gave a bad answer", and
        # blocks a draft on a perfectly specific fund name (the case-record
        # eval's own "HSBC Global Balanced Fund" is one). R09's ask is aimed
        # at a FUND HOUSE named without a fund — a judgment the rules layer
        # makes on the wording, not something a membership test can see.
        #
        # TIGHTEN THIS TO unpopulate WHEN 066 IS COMPLETE, not before.
        value_contract:
          kind: table
          table: funds
          on_unmatched: accept
          stored_form: entry_value

      - id: objective_alignment
        required: true
        askable: false
        derived_from: [fund_selection, risk_profile]
        notes: >-
          NEVER ASKED (R09, amelia-ruled 2026-08-01). Alignment is COMPUTED from
          the named fund's equity allocation against the client's stated risk
          profile — the advisor is not the source. This field was `askable: true`
          with an ask_hint reading "How the fund selection aligns with the
          client's objective", which is verbatim the question the ILP GATE
          forbids: intake builds its questions from the empty-required set, so
          the record was generating the exact defect the rules prohibit. An
          unresolvable fund asks for the specific FUND NAME, never for alignment.
        # The comparison has exactly two outcomes, and 160 gives each a
        # different behaviour: aligned -> proceed silently; mismatched -> do
        # not block, flag it in one sentence. Two behaviours off one field is
        # precisely a case for a closed set rather than free prose.
        value_contract:
          kind: enum
          values: [aligned, mismatched]
          match:
            - {pattern: '(?i)(mismatch|does not match|not aligned|misaligned|conflict)', value: mismatched}
            - {pattern: '(?i)(align|match|consistent|suitable)', value: aligned}

      - id: high_premium_declaration_wording
        required: false
        askable: true
        applies_when: annual_ilp_premium_above_36000_sgd
        ask_hint: >-
          Approved wording for the annual-ILP-premium-above-S$36,000
          declaration.

      - id: sustainability_answer
        required: false
        askable: true
        ask_hint: >-
          Do the client's total annual premiums exceed 50% of their surplus?
        holds: >-
          Whether total annual premiums EXCEED 50% of the client's surplus.
          True = they exceed it; false = they do not.
        notes: >-
          PROMOTED FROM RAW-TEXT MATCHING (2026-08-04). Output assembly used to
          decide the sustainability scope by regex over the conversation text —
          a second source of truth for a fact the record should hold. It is now
          a contracted field, and compliance/012 maps it to the scope tag.
          NOT required: the answer is volunteered, and forcing it into the
          empty-required set would create an intake question amelia never
          ruled. Assembly still falls back to text matching when the field is
          empty, so nothing silently loses its compliance scope.
          MAY RETIRE: if the pending 50%-removal ruling confirms, this field
          and its block go away together — that is a deletion, not a rework.
        value_contract:
          kind: boolean
          match:
            # Ordered: the negations must be read before the bare "exceed".
            - {pattern: '(?i)(do(es)? not exceed|below 50%|under 50%|less than 50%|within 50%)', value: false}
            - {pattern: '(?i)(more than 50%|exceeds? 50%|above 50%|over 50%)', value: true}

      - id: product_category
        required: false
        askable: false
        derived_from: [proposed_plan]
        notes: >-
        notes: >-
          DERIVED from the PRODUCT the advisor named (see the product_category
          derivation below), never asked. Drives the deterministic disclaimer-set
          selection in reference/065-disclaimer-selection.yaml (investment products
          are GIO — no medical underwriting — so they must not carry the medical
          non-disclosure line). A category that cannot be defended from the product
          or from an actual case classification stays EMPTY and output assembly
          fails closed; it is never defaulted to protection_life, because a default
          would silently mean UNDERWRITTEN.
        # CONTRACT AND DERIVATION, COMPOSED. The derivation at the foot of this
        # file PRODUCES the value from the product the advisor named; this
        # contract is what the record CHECKS it against at the write, so the
        # stored category is always one of the keys
        # reference/065-disclaimer-selection.yaml switches on and can never be a
        # variant spelling a later reader has to normalise for itself.
        # `unresolved` IS one of the permitted values on purpose: it is the
        # derivation's terminal answer for a product whose category has no
        # approved requirement set ("Careshield Plus" is not an Integrated
        # Shield Plan), and 065 maps it to NO scope tag, so a completed draft
        # fails assembly closed. It therefore has to be STORABLE — a contract
        # that unpopulated it would hand the field back to the weaker
        # case-type mirror, which is exactly the guess the derivation exists to
        # replace. An answer the contract cannot resolve populates nothing.
        value_contract:
          kind: enum
          values: [protection_life, investment_linked, shield_hospitalisation, unresolved]
          match:
            - {pattern: '(?i)^unresolved$', value: unresolved}
            - {pattern: '(?i)(investment[-_ ]?linked|\bilp\b)', value: investment_linked}
            - {pattern: '(?i)(shield|hospitalisation|hospitalization)', value: shield_hospitalisation}
            - {pattern: '(?i)(protection|life|term|whole[-_ ]?life|\bci\b)', value: protection_life}

  # ── Shield / hospitalisation ─────────────────────────────────────────
  shield_hospitalisation:
    case_type: shield_hospitalisation
    fields:
      - id: existing_plans
        required: true
        askable: true
        ask_hint: >-
          Existing arrangement — insurer, exact base plan name, exact
          versioned rider name, material premium. "None" for a first purchase.
        holds: >-
          The plan(s) the client already holds, however the advisor names
          them — a product name alone IS the value. "None" for a first
          purchase.
        # IDENTITY IS NOT COMPLETENESS (see the value-contract note at the
        # head of this file). `holds` deliberately lets a bare product name
        # populate this field, because the name IS a stated fact. But a name
        # is not what R01 calls a material fact: "supplied protection amounts
        # or durations needed for a comparison". Without this, "GE term plan"
        # fills the field, the field leaves the empty-required set, and the
        # record tells the model the case is ready to draft — which is
        # exactly the MTU-011 defect (a one-line replacement request produced
        # a complete BOR). "None" satisfies it: a first purchase has no
        # amounts to give, and the answer is complete as it stands.
        sufficiency:
          description: >-
            the protection amount(s) or premium, or the coverage duration
          any_of:
            - name: "an amount"
              pattern: '(?i)(s?\$\s?[\d,]+|\b[\d,]+\s*(sgd|dollars)\b|\b\d+\s?k\b)'
            - name: "a duration"
              pattern: '(?i)(\b\d{1,2}\s*-?\s*(year|yr)s?\b|\bto\s+age\s*\d{2}\b|\bage\s*\d{2}\b|\b\d{1,2}\s?pay\b|\bmip\s?\d{1,2}\b)'
            - name: "an explicit none"
              pattern: '(?i)^[\s\[\{"'']*(none|no|nil|n/?a|no existing|not applicable|first purchase|new purchase)\b'

      - id: proposed_plan
        required: true
        askable: true
        ask_hint: >-
          Proposed arrangement — insurer, exact base plan name, exact
          versioned rider name, material premium.
        holds: >-
          The plan being proposed, however the advisor names it. A product
          name or shorthand on its own IS the value, INCLUDING when it appears
          inside a request to produce a document ("BOR for <product>") — the
          product named in the request IS the proposed plan, so record that
          name. When a later message adds detail about that same plan —
          premium, term, riders, sum assured, category — record the field
          again as the name PLUS that detail, so the value grows instead of
          either staying a bare name or losing it.
        # VALIDATE, NEVER REWRITE. The approved-product list (062) says in its
        # own escalation_cue that a product with no entry is NOT a reason to
        # withhold a draft — use the advisor's own words for it. So this
        # contract accepts an unmatched name (on_unmatched: accept) and keeps
        # the answer whole (stored_form: as_written); the match only records
        # that the product IS one we hold reference examples for. Unpopulating
        # here would invent a refusal amelia explicitly ruled against.
        value_contract:
          kind: table
          table: approved_products
          on_unmatched: accept
          stored_form: as_written
        # IDENTITY IS NOT COMPLETENESS. Same reasoning as existing_plans: the
        # product name is a real fact and is recorded, but a BOR cannot be
        # written from a name. A product-name shorthand that carries its own
        # period ("Voyage 15", "10pay") satisfies the duration probe, which is
        # correct — the advisor did state a material fact inside the name.
        sufficiency:
          description: >-
            the premium or sum assured, or the policy term / minimum
            investment period
          any_of:
            - name: "an amount"
              pattern: '(?i)(s?\$\s?[\d,]+|\b[\d,]+\s*(sgd|dollars)\b|\b\d+\s?k\b)'
            - name: "a duration"
              pattern: '(?i)(\b\d{1,2}\s*-?\s*(year|yr)s?\b|\bto\s+age\s*\d{2}\b|\bage\s*\d{2}\b|\b\d{1,2}\s?pay\b|\bmip\s?\d{1,2}\b|\b(voyage|abundance)\s*\d{1,2}\b)'

      - id: is_replacement
        required: true
        askable: false
        derived_from: [existing_plans]
        # The derivation table below resolves to "yes"/"no"; the contract turns
        # those into a real boolean, so no reader downstream has to decide
        # whether "yes", "Yes", and "true" are the same answer.
        value_contract:
          kind: boolean
          match:
            - {pattern: '(?i)^\s*(yes|rop|replacement)\b', value: true}
            - {pattern: '(?i)^\s*(no|non-rop|not a replacement)\b', value: false}

      - id: replaced_products
        required: false
        askable: true
        applies_when: rop
        ask_hint: "Which product(s) are being replaced?"

      - id: replacing_products
        required: false
        askable: true
        applies_when: rop
        ask_hint: "Which product(s) are replacing them?"

      - id: client_stated_rationale
        required: false
        askable: false
        notes: >-
          NEVER SOLICITED — on Shield too. The SHIELD / HOSPITALISATION CONTRACT
          is explicit that "the client's rationale is NOT required — default to the
          standard hospitalisation-needs reason (see STANDARD NARRATIVE DEFAULTS);
          use a supplied client-specific reason only if the advisor gave one", and
          R13's never-ask list covers the client's reason for every category. This
          field previously read required+askable, which put the rationale into the
          empty-required set intake builds questions from — i.e. the record was
          generating exactly the ask the constitution forbids. Record it only when
          the advisor volunteers it.

      - id: exact_versioned_rider_name
        required: false
        askable: true
        ask_hint: "Exact / versioned rider name."
        notes: >-
          Identifies the arrangement ONLY. Rider benefit limits, deductible,
          and coinsurance are never collected and never printed.
      - id: sustainability_answer
        required: false
        askable: true
        ask_hint: >-
          Do the client's total annual premiums exceed 50% of their surplus?
        holds: >-
          Whether total annual premiums EXCEED 50% of the client's surplus.
          True = they exceed it; false = they do not.
        notes: >-
          PROMOTED FROM RAW-TEXT MATCHING (2026-08-04). Output assembly used to
          decide the sustainability scope by regex over the conversation text —
          a second source of truth for a fact the record should hold. It is now
          a contracted field, and compliance/012 maps it to the scope tag.
          NOT required: the answer is volunteered, and forcing it into the
          empty-required set would create an intake question amelia never
          ruled. Assembly still falls back to text matching when the field is
          empty, so nothing silently loses its compliance scope.
          MAY RETIRE: if the pending 50%-removal ruling confirms, this field
          and its block go away together — that is a deletion, not a rework.
        value_contract:
          kind: boolean
          match:
            # Ordered: the negations must be read before the bare "exceed".
            - {pattern: '(?i)(do(es)? not exceed|below 50%|under 50%|less than 50%|within 50%)', value: false}
            - {pattern: '(?i)(more than 50%|exceeds? 50%|above 50%|over 50%)', value: true}

      - id: product_category
        required: false
        askable: false
        derived_from: [proposed_plan]
        notes: >-
        notes: >-
          DERIVED from the PRODUCT the advisor named (see the product_category
          derivation below), never asked. Drives the deterministic disclaimer-set
          selection in reference/065-disclaimer-selection.yaml (investment products
          are GIO — no medical underwriting — so they must not carry the medical
          non-disclosure line). A category that cannot be defended from the product
          or from an actual case classification stays EMPTY and output assembly
          fails closed; it is never defaulted to protection_life, because a default
          would silently mean UNDERWRITTEN.
        # CONTRACT AND DERIVATION, COMPOSED. The derivation at the foot of this
        # file PRODUCES the value from the product the advisor named; this
        # contract is what the record CHECKS it against at the write, so the
        # stored category is always one of the keys
        # reference/065-disclaimer-selection.yaml switches on and can never be a
        # variant spelling a later reader has to normalise for itself.
        # `unresolved` IS one of the permitted values on purpose: it is the
        # derivation's terminal answer for a product whose category has no
        # approved requirement set ("Careshield Plus" is not an Integrated
        # Shield Plan), and 065 maps it to NO scope tag, so a completed draft
        # fails assembly closed. It therefore has to be STORABLE — a contract
        # that unpopulated it would hand the field back to the weaker
        # case-type mirror, which is exactly the guess the derivation exists to
        # replace. An answer the contract cannot resolve populates nothing.
        value_contract:
          kind: enum
          values: [protection_life, investment_linked, shield_hospitalisation, unresolved]
          match:
            - {pattern: '(?i)^unresolved$', value: unresolved}
            - {pattern: '(?i)(investment[-_ ]?linked|\bilp\b)', value: investment_linked}
            - {pattern: '(?i)(shield|hospitalisation|hospitalization)', value: shield_hospitalisation}
            - {pattern: '(?i)(protection|life|term|whole[-_ ]?life|\bci\b)', value: protection_life}

# ── Value tables (CLIENT-OWNED) ──────────────────────────────────────────
#
# The reference sets a table-kind value_contract checks against. A table
# either POINTS at a reference file someone else maintains on its own
# schedule, or declares its entries inline when this file is their only home.
#
# Pointing is the better shape wherever the file exists: copying the approved
# product list in here would fork it the first time 062 changed, and the copy
# would keep answering with confidence. `select` / `value_key` / `aliases_key`
# say how to read THAT file's own column names, so the reference file is never
# reshaped to suit this consumer.

value_tables:

  # R03's approved-product reference. Consumed by proposed_plan as a
  # VALIDATOR only — 062's own escalation_cue rules that an unlisted product
  # still gets a draft in the advisor's own words.
  approved_products:
    source: reference/062-approved-products.yaml
    select: entries
    value_key: key
    aliases_key: aliases

  # R09's fund reference. Consumed by fund_selection, which stores a KNOWN
  # fund under the canonical name here (so the alignment computation can look
  # it up) and accepts an unknown one as written — see that field for why a
  # three-row table must not be allowed to refuse answers.
  funds:
    source: reference/066-funds.yaml
    select: entries
    value_key: key
    aliases_key: aliases

  # R19 (Melody, 2026-08-03): which minimum investment periods each product
  # actually offers. Keyed by proposed_plan. A product with no row here — or a
  # row with no `values` — places NO constraint, which is deliberate: only
  # Abundance's set is confirmed, and asserting a set for anything else would
  # be inventing product facts. Adding a product means adding a row, no code.
  product_min_investment_periods:
    entries:
      - value: "Wealth Abundance"
        aliases: ["Abundance"]
        values: ["10-year minimum investment period"]


# ── Derivations (CLIENT-OWNED) ───────────────────────────────────────────
#
# The record module supplies the derivation HOOK; what may be derived from
# what is a domain judgment, so the rules live here. Each rule reads ONE
# recorded answer and resolves the target field from it; the derived value
# inherits the source answer's message id, so provenance leads back to the
# message the advisor actually wrote. A derived field is filled, and a filled
# field is never re-asked.
#
# Ordering matters within `matches`: the first pattern that matches wins.
# `default: null` means "cannot be derived yet" — the field stays empty.

derivations:

  # R06/R08 (amelia-ruled 2026-08-01): "no existing plans" is a complete
  # answer — it makes the case non-ROP with no further question. An existing
  # plan the advisor describes as being replaced is ROP. Anything else stays
  # underived, so the ROP GATE's single conversational question still applies.
  is_replacement:
    # Rules are tried in order against whichever answer is recorded; the first
    # that resolves wins. A named replaced product IS the replacement answer,
    # so it settles ROP without the existing-plans wording having to say so.
    - from: replaced_products
      matches:
        - pattern: '\S'
          value: "yes"
      default: null
    - from: existing_plans
      matches:
        - pattern: '(?i)^[\s\[\{"'']*(none|no|nil|n/?a|no existing|not applicable|first purchase|new purchase)\b'
          value: "no"
        - pattern: '(?i)(replac|switch(ing)? (from|out)|surrender|terminat|cancel(ling|ing)?)'
          value: "yes"
      default: null

  # PRODUCT-NAME SHORTHAND (amelia-ruled 2026-08-01): "Voyage 15" / "10pay" names
  # the minimum investment period. The number is IN the product name the advisor
  # already gave, so asking for it is the defect this derivation removes. It fires
  # only when the field is empty, so an explicitly stated period always wins (and
  # a product rule that contradicts a stated period — R19's MIP10-only Abundance —
  # is still the rules layer's to challenge).
  # R19 (amelia relaying Melody, 2026-08-03): "HSBC Life Wealth Abundance offers
  # MIP10 ONLY — never write a 15-year or 20-year Abundance." A minimum investment
  # period is only real if the product actually offers it, so the derivation may
  # fill it ONLY from a product whose available periods are CONFIRMED in this
  # constitution or a supplied product summary. Today that is exactly one product:
  # Abundance = MIP10. Everything else — including "Voyage 15" and "10pay", whose
  # number LOOKS self-validating — stays EMPTY on purpose, so the field is still in
  # the empty-required set and R19's one-line confirm ask actually fires. The
  # earlier rule filled every number straight out of the product name, which meant
  # the confirm ask R19 exists to force could never trigger.
  min_investment_period:
    - from: proposed_plan
      matches:
        - pattern: '(?i)abundance'
          value: '10-year minimum investment period'
      default: null

  # PRODUCT -> PRODUCT CATEGORY (the deterministic input to disclaimer selection).
  #
  # WHY THIS EXISTS: product_category drives reference/065-disclaimer-selection.yaml,
  # which decides whether a completed draft is scoped UNDERWRITTEN (carries the
  # pre-existing-medical-conditions sentence) or GIO (must not). Before this rule
  # the field was only ever mirrored from the case-TYPE classification, and an
  # unclassified case fell through to the default type protection_life —
  # i.e. UNDERWRITTEN — so a GIO/ILP case could receive the pre-existing-conditions
  # sentence with no evidence behind it. That is Melody's third reported defect,
  # and it was reachable on the live runtime. The product the advisor named is the
  # evidence; a default is not.
  #
  # ORDERING IS LOAD-BEARING (first match wins):
  #   1. products whose category has NO approved requirement set resolve to
  #      `unresolved` FIRST — "Careshield Plus" contains "shield" and must never
  #      read as an Integrated Shield Plan. `unresolved` maps to no scope tag, so
  #      output assembly FAILS CLOSED on a completed draft rather than guessing an
  #      underwriting scope. These categories are withheld by SUPPORTED CATEGORIES
  #      anyway, so failing closed agrees with the rules layer instead of fighting
  #      it (the gate only applies to a COMPLETED draft; a withhold/ask reply is
  #      NO_DRAFT and is unaffected).
  #   2. named investment products, then Shield, then protection/life.
  #   3. generic category words last, so an unlisted product still resolves by the
  #      category the advisor named ("a Singlife term plan"). This is what keeps
  #      reference/062's promise that an unlisted product never withholds a draft.
  # Nothing matched = empty. An empty category is NOT protection_life; it leaves
  # the field for the case-type mirror, and if that cannot defend a value either,
  # assembly fails closed.
  product_category:
    - from: proposed_plan
      matches:
        # 1. known products with no approved requirement set -> fail closed
        - pattern: '(?i)care\s*shield|elder\s*shield'
          value: unresolved
        - pattern: '(?i)indexed universal life|\biul\b|diamond iul'
          value: unresolved
        - pattern: '(?i)indexed flexi income'
          value: unresolved
        - pattern: '(?i)flexi life income'
          value: unresolved
        - pattern: '(?i)accident'
          value: unresolved
        - pattern: '(?i)navigator|ifast|flexiprotector'
          value: unresolved
        # 2. named investment-linked / investment products
        - pattern: '(?i)abundance|voyage|savvyinvest'
          value: investment_linked
        # 3. Shield / hospitalisation
        - pattern: '(?i)\bshield\b|hospitalisation|hospitalization'
          value: shield_hospitalisation
        # 4. named protection / life products
        - pattern: '(?i)term protector|elite term|my wl choice'
          value: protection_life
        # 5. generic category words the advisor used, lowest priority
        - pattern: '(?i)investment[- ]linked|\bilp\b'
          value: investment_linked
        - pattern: '(?i)whole life|\bwl\b|\bterm\b|critical illness|\bci\b'
          value: protection_life
      default: null
