# MTU — product category -> required disclaimer set (CLIENT CONFIG)
#
# WHY THIS FILE EXISTS
# Melody's third reported defect: the assistant carried the health/medical
# disclaimer on an INVESTMENT product. Investment products here are GIO
# (guaranteed issue offer) — no medical underwriting — so the medical
# non-disclosure line does not belong in their BOR. Selection must therefore be
# DETERMINISTIC from the product category, not a model judgment.
#
# HOW IT WORKS
# The case record's `selection_field` (a recorded, provenance-carrying field)
# names the case's product category. The runtime looks the category up here and
# hands the result to output assembly, which resolves the shared anchor block to
# the mapped variant. The model still decides only WHERE the disclosure block
# goes; it never decides WHICH approved text lands there.
#
# STATUS: MECHANISM LIVE, VALUES PENDING AMELIA (via edna-mtu). The two-value
# mapping below is the current best reading of the defect report. Confirming or
# changing it is a one-line edit per category — no code change.

version: 1

# Case-record field consulted first; the case's own type is the fallback.
selection_field: product_category
default_category: protection_life

categories:

  # Medically underwritten protection/life: the full approved disclosure set.
  protection_life:
    substitutions: {}
    forbid: [general_disclosures_gio]

  # Shield / hospitalisation: medically underwritten, full set.
  shield_hospitalisation:
    substitutions: {}
    forbid: [general_disclosures_gio]

  # Investment-linked (GIO — no medical underwriting): the general-disclosures
  # anchor resolves to the GIO variant, which drops the medical non-disclosure
  # line and keeps every other approved line verbatim.
  investment_linked:
    substitutions:
      general_disclosures: general_disclosures_gio
    forbid: []
